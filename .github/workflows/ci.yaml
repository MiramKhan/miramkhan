name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run application smoke test
        run: |
          python -m py_compile app/app.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/miramkhan/devops-api:${{ github.sha }}

      - name: Update Kubernetes image
        run: |
          sed -i "s|ghcr.io/miramkhan/devops-api:PLACEHOLDER|ghcr.io/miramkhan/devops-api:${{ github.sha }}|" k8s/backend.yaml

      - name: Commit Kubernetes image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend.yaml

          git diff --cached --quiet || git commit -m "Update backend image to ${{ github.sha }}"

          git push